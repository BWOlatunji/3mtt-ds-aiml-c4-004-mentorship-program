name: Validate Repository

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for large files
        run: |
          echo "Checking for files larger than 50MB..."

          LARGE_FILES=$(find . \
            -type f \
            -not -path './.git/*' \
            -size +50M \
            -print)

          if [ -n "$LARGE_FILES" ]; then
            echo "The following files exceed 50MB:"
            echo "$LARGE_FILES"
            exit 1
          fi

          echo "No files larger than 50MB found."

      - name: Check required directories
        run: |
          REQUIRED_DIRS=(
            "00_admin"
            "01_curriculum"
            "02_assignments"
            "03_submissions"
            "04_projects"
            "05_training_materials"
            "06_datasets"
            "07_code_library"
            "08_resources"
            "09_feedback"
            "10_assessments"
            "11_templates"
            "12_meeting-notes"
          )

          for DIR in "${REQUIRED_DIRS[@]}"; do
            if [ ! -d "$DIR" ]; then
              echo "Missing required directory: $DIR"
              exit 1
            fi
          done

          echo "All required directories exist."
